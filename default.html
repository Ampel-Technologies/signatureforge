<!--
  SignatureForge default template
  Tokens: displayName, title, organization, phone, email, website, address, pronouns
  Use {{token}} for HTML-escaped values, {{{token}}} for raw HTML.
  Edit freely. The admin UI provides a live preview as you change this file.

  Email-client compatibility notes:
    - Inline styles only (no <style> blocks; many clients strip them).
    - Use <table> rather than flexbox/grid for layout reliability.
    - Web-safe fonts in the cascade (Outlook on Windows ignores most others).
    - Logos must be hosted at a public HTTPS URL if you add an <img> tag.
-->
<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#1a1815;font-size:13px;line-height:1.5;">
  <tr>
    <td style="padding:0;vertical-align:top;">
      <div style="font-size:15px;font-weight:600;color:#1a1815;letter-spacing:0.01em;">
        {{displayName}}<span style="color:#8b8780;font-weight:400;font-size:12px;"> {{pronouns}}</span>
      </div>
      <div style="font-size:12px;color:#5a5650;margin-top:2px;">
        {{title}}<span style="color:#bc4b27;"> &middot; </span>{{organization}}
      </div>
      <div style="height:8px;line-height:8px;font-size:0;">&nbsp;</div>
      <div style="font-size:12px;color:#5a5650;line-height:1.7;">
        <span style="color:#8b8780;">e</span> <a href="mailto:{{email}}" style="color:#1a1815;text-decoration:none;border-bottom:1px solid #d4cfc4;">{{email}}</a>
        &nbsp;<span style="color:#d4cfc4;">|</span>&nbsp;
        <span style="color:#8b8780;">t</span> {{phone}}
      </div>
      <div style="font-size:12px;color:#5a5650;line-height:1.7;">
        <span style="color:#8b8780;">w</span> <a href="{{website}}" style="color:#1a1815;text-decoration:none;border-bottom:1px solid #d4cfc4;">{{website}}</a>
      </div>
      <div style="font-size:11px;color:#8b8780;margin-top:4px;font-style:italic;">{{address}}</div>
    </td>
  </tr>
</table>
