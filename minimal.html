<!--
  SignatureForge minimal template
  Tokens: displayName, title, organization, email, phone
  A pared-down signature for users who prefer an austere look.
-->
<div style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#1a1815;font-size:13px;line-height:1.6;">
  <div><strong style="font-weight:600;">{{displayName}}</strong></div>
  <div style="color:#5a5650;font-size:12px;">{{title}}, {{organization}}</div>
  <div style="color:#5a5650;font-size:12px;">{{email}} &nbsp;&middot;&nbsp; {{phone}}</div>
</div>
